services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bulk
      POSTGRES_PASSWORD: bulk
      POSTGRES_DB: bulk_review
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulk -d bulk_review"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
