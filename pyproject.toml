[project]
name = "bulk-review"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbos>=3.4.0",
    "fastapi>=0.162.0",
    "openai>=3.41.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
